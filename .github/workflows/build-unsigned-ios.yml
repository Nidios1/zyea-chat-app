name: build-unsigned-ios

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-unsigned-ios.yml'
  workflow_dispatch:

jobs:
  build-unsigned-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            echo ""
            echo "💡 To fix this:"
            echo "   1. Go to your GitHub repository"
            echo "   2. Navigate to: Settings > Secrets and variables > Actions"
            echo "   3. Click 'New repository secret'"
            echo "   4. Name: EXPO_TOKEN"
            echo "   5. Value: Your Expo access token"
            echo ""
            echo "📖 Get your token from: https://expo.dev/accounts/[your-account]/settings/access-tokens"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          package-manager: npm

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          echo "📦 Installing npm dependencies..."
          npm install --legacy-peer-deps || npm install
          
          echo "✅ Dependencies installed"

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild for iOS..."
          
          # Clean existing ios folder if it exists
          if [ -d "ios" ]; then
            echo "🧹 Cleaning existing ios/ folder..."
            rm -rf ios/
          fi
          
          # Run prebuild
          npx expo prebuild --platform ios --clean --no-install
          
          # Verify ios folder was created
          if [ ! -d "ios" ]; then
            echo "❌ ERROR: ios/ folder was not created by prebuild!"
            exit 1
          fi
          
          echo "✅ Prebuild completed"
          echo "📂 iOS project structure:"
          ls -la ios/ | head -20

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          pod install --repo-update || pod install
          
          echo "✅ CocoaPods installation completed"
          
          # Verify Pods directory
          if [ ! -d "Pods" ]; then
            echo "❌ ERROR: Pods directory not found!"
            exit 1
          fi
          
          echo "📂 Pods directory verified"

      - name: 🏗️ Build Archive (unsigned)
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Building iOS archive (unsigned)..."
          
          # Find workspace
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            ls -la
            exit 1
          fi
          
          echo "✅ Found workspace: $WORKSPACE"
          
          # Get scheme name
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            # Try to get from app.json
            APP_SLUG=$(node -e "console.log(require('../app.json').expo.slug)" 2>/dev/null || echo "")
            SCHEME="${APP_SLUG:-zyea-mobile}"
            echo "⚠️ Using scheme from app.json or default: $SCHEME"
          else
            echo "✅ Detected scheme: $SCHEME"
          fi
          
          # Verify scheme exists
          SCHEME_EXISTS=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -c "$SCHEME" || echo "0")
          if [ "$SCHEME_EXISTS" -eq "0" ]; then
            echo "❌ ERROR: Scheme '$SCHEME' not found!"
            echo "📋 Available schemes:"
            xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Schemes:" || true
            exit 1
          fi
          
          # Clean previous builds
          echo "🧹 Cleaning previous builds..."
          rm -rf build/ || true
          mkdir -p build
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          # First, build the app to generate .app file
          echo "🏗️ Building app first (this may take 10-15 minutes)..."
          BUILD_OUTPUT=$(mktemp)
          set +e
          
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" 2>&1 | tee "$BUILD_OUTPUT"
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "📋 Last 100 lines of build output:"
            tail -100 "$BUILD_OUTPUT" || cat "$BUILD_OUTPUT"
            echo ""
            echo "📋 Searching for error patterns:"
            grep -i "error:" "$BUILD_OUTPUT" | tail -30 || echo "No error patterns found"
            echo ""
            echo "📋 Searching for warning patterns:"
            grep -i "warning:" "$BUILD_OUTPUT" | tail -15 || echo "No warning patterns found"
            rm -f "$BUILD_OUTPUT"
            exit 1
          fi
          
          rm -f "$BUILD_OUTPUT"
          echo "✅ Build completed successfully!"
          
          # Find the .app file from build
          echo "🔍 Looking for .app file in build output..."
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "⚠️ Not found in Release-iphoneos, searching in entire DerivedData..."
            APP_PATH=$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: Could not find .app file after build!"
            echo "📂 Build directory structure:"
            find build/DerivedData/Build/Products -type d -maxdepth 3 2>/dev/null | head -20 || echo "Products directory not found"
            echo ""
            echo "📂 Searching in entire DerivedData:"
            find build/DerivedData -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App details:"
          ls -lh "$APP_PATH" | head -5
          
          # Create archive manually by copying .app into archive structure
          echo "📦 Creating archive structure..."
          mkdir -p build/app.xcarchive/Products/Applications
          
          APP_NAME=$(basename "$APP_PATH")
          echo "📋 Copying $APP_NAME to archive..."
          
          # Use absolute path for copy
          ABS_APP_PATH=$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")
          ABS_ARCHIVE_PATH=$(pwd)/build/app.xcarchive/Products/Applications
          
          echo "📋 Source: $ABS_APP_PATH"
          echo "📋 Destination: $ABS_ARCHIVE_PATH/$APP_NAME"
          
          # Copy with verbose output
          cp -rv "$ABS_APP_PATH" "$ABS_ARCHIVE_PATH/" || {
            echo "❌ Copy failed, trying alternative method..."
            cp -r "$APP_PATH" "build/app.xcarchive/Products/Applications/" || {
              echo "❌ Alternative copy also failed!"
              exit 1
            }
          }
          
          # Verify copy was successful
          if [ ! -d "build/app.xcarchive/Products/Applications/$APP_NAME" ]; then
            echo "❌ ERROR: .app file was not copied to archive!"
            echo "📂 Archive Products/Applications contents:"
            ls -la build/app.xcarchive/Products/Applications/ || true
            echo "📂 Source app path:"
            ls -la "$APP_PATH" || true
            exit 1
          fi
          
          # Copy Info.plist if available
          if [ -f "../$SCHEME/Info.plist" ]; then
            cp "../$SCHEME/Info.plist" "build/app.xcarchive/Info.plist" || true
          fi
          
          echo "✅ Archive structure created successfully!"
          echo "📂 Archive location: build/app.xcarchive"
          echo "📂 Archive Products/Applications contents:"
          ls -lah build/app.xcarchive/Products/Applications/ || true
          echo ""
          echo "📂 Verifying .app file in archive:"
          if [ -d "build/app.xcarchive/Products/Applications/$APP_NAME" ]; then
            echo "✅ .app file verified in archive!"
            ls -lh "build/app.xcarchive/Products/Applications/$APP_NAME" | head -5
          else
            echo "❌ .app file NOT found in archive!"
            exit 1
          fi

      - name: 📦 Export IPA from Archive
        working-directory: ./mobile-expo
        run: |
          echo "📦 Exporting IPA from archive..."
          
          # Find .app in archive
          APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: Could not find .app file in archive!"
            echo "📂 Archive structure:"
            ls -la ios/build/app.xcarchive/Products/Applications/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          
          # Create IPA
          echo "📦 Creating IPA file..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          
          # Zip into IPA
          zip -r build.ipa Payload
          rm -rf Payload
          
          # Verify IPA was created
          if [ ! -f "build.ipa" ]; then
            echo "❌ ERROR: IPA file was not created!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          
          echo "✅ IPA created successfully!"
          echo "📦 IPA file: build.ipa"
          echo "📦 Size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          ls -lh build.ipa

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Build Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with tools like eSign or AltStore before installing." >> $GITHUB_STEP_SUMMARY

