name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: pod install --repo-update || pod install

      - name: 🏗️ Build iOS App
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Building iOS app..."
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          echo "✅ Found workspace: $WORKSPACE"
          
          # Get scheme
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
          fi
          
          echo "✅ Using scheme: $SCHEME"
          
          # Clean
          echo "🧹 Cleaning..."
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          # Build app (this builds the app target and creates .app in DerivedData)
          echo "🏗️ Building app..."
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            -destination "generic/platform=iOS" 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Build failed!"
            echo "📋 Errors:"
            grep -i "error:" build.log | tail -30 || echo "No 'error:' found"
            echo ""
            echo "📋 Last 100 lines:"
            tail -100 build.log || cat build.log
            exit 1
          fi
          
          echo "✅ Build completed successfully"
          
          # Check if BUILD SUCCEEDED
          if grep -i "BUILD SUCCEEDED" build.log > /dev/null; then
            echo "✅ Build log confirms: BUILD SUCCEEDED"
          fi
          
          # Find .app in DerivedData
          echo ""
          echo "🔍 Searching for .app in DerivedData..."
          APP_FOUND=$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_FOUND" ]; then
            echo "✅ Found .app: $APP_FOUND"
            echo "📂 App location:"
            ls -la "$APP_FOUND" | head -5 || true
          else
            echo "⚠️ .app not found yet, will search comprehensively later"
            echo "📂 DerivedData structure:"
            find build/DerivedData -type d -maxdepth 4 2>/dev/null | head -20 || true
            echo ""
            echo "📂 Products directory:"
            if [ -d "build/DerivedData/Build/Products" ]; then
              ls -la build/DerivedData/Build/Products/ 2>/dev/null || true
              echo ""
              echo "📂 All subdirectories in Products:"
              find build/DerivedData/Build/Products -type d -maxdepth 1 2>/dev/null || true
            fi
          fi

      - name: 📦 Find .app and Create IPA
        working-directory: ./mobile-expo
        run: |
          echo "📦 Finding .app and creating IPA..."
          
          APP_PATH=""
          
          # Priority 1: Check DerivedData Products (build creates .app here)
          if [ -d "ios/build/DerivedData/Build/Products" ]; then
            echo "📂 Checking DerivedData Products (Priority 1)..."
            # Check all subdirectories in Products
            for subdir in ios/build/DerivedData/Build/Products/*/; do
              if [ -d "$subdir" ]; then
                FOUND=$(find "$subdir" -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
                if [ -n "$FOUND" ]; then
                  APP_PATH="$FOUND"
                  echo "✅ Found in $(basename "$subdir"): $APP_PATH"
                  break
                fi
              fi
            done
            # If not found in subdirs, search recursively
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
              if [ -n "$APP_PATH" ]; then
                echo "✅ Found in Products (recursive): $APP_PATH"
              fi
            fi
          fi
          
          # Priority 2: Search entire DerivedData
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData" ]; then
            echo "📂 Searching entire DerivedData (Priority 2)..."
            APP_PATH=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found in DerivedData: $APP_PATH"
            fi
          fi
          
          # Priority 3: Check archive Products/Applications
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products/Applications" ]; then
            echo "📂 Checking archive Products/Applications (Priority 3)..."
            APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in archive Applications: $APP_PATH"
            fi
          fi
          
          # Priority 4: Check archive Products
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products" ]; then
            echo "📂 Checking archive Products (Priority 4)..."
            APP_PATH=$(find ios/build/app.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in archive Products: $APP_PATH"
            fi
          fi
          
          # Priority 5: Search entire ios/build
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            echo "📂 Searching entire ios/build (Priority 5)..."
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found: $APP_PATH"
            fi
          fi
          
          # Final check
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "❌ ERROR: Could not find .app file!"
            echo ""
            echo "📂 Debug information:"
            echo "Current directory: $(pwd)"
            echo ""
            echo "📂 DerivedData structure:"
            if [ -d "ios/build/DerivedData" ]; then
              echo "DerivedData exists"
              echo ""
              echo "📂 Build directory:"
              ls -la ios/build/DerivedData/Build/ 2>/dev/null || echo "Build directory not found"
              echo ""
              echo "📂 Products directory:"
              if [ -d "ios/build/DerivedData/Build/Products" ]; then
                ls -la ios/build/DerivedData/Build/Products/ 2>/dev/null || true
                echo ""
                echo "📂 All subdirectories in Products:"
                find ios/build/DerivedData/Build/Products -type d -maxdepth 1 2>/dev/null || true
                echo ""
                echo "📂 Contents of each subdirectory:"
                for subdir in ios/build/DerivedData/Build/Products/*/; do
                  if [ -d "$subdir" ]; then
                    echo "--- $(basename "$subdir") ---"
                    ls -la "$subdir" 2>/dev/null | head -10 || true
                  fi
                done
              else
                echo "Products directory does not exist!"
              fi
              echo ""
              echo "🔍 Recursive search in DerivedData:"
              find ios/build/DerivedData -type d -name "*.app" 2>/dev/null || echo "No .app found"
            else
              echo "DerivedData does not exist!"
            fi
            echo ""
            echo "🔍 All .app files in project:"
            find . -name "*.app" -type d 2>/dev/null | head -10 || echo "None found"
            exit 1
          fi
          
          echo ""
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App size:"
          du -sh "$APP_PATH" || true
          
          # Create IPA
          echo ""
          echo "📦 Creating IPA..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ ! -f "build.ipa" ]; then
            echo "❌ Failed to create IPA"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "✅ IPA created! Size: $FILE_SIZE_MB MB"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
