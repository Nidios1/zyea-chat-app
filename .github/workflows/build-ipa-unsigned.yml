name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      - name: ☕️ Setup CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: 🔨 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🏗️ Generate iOS project
        working-directory: ./mobile-expo
        run: |
          npx expo prebuild --platform ios --clean
          if [ ! -d "ios" ]; then
            echo "❌ ERROR: iOS directory not found"
            exit 1
          fi

      - name: 📦 Install CocoaPods
        working-directory: ./mobile-expo/ios
        run: |
          pod install

      - name: 🏗️ Build IPA
        working-directory: ./mobile-expo/ios
        run: |
          # Find workspace
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No workspace found"
            exit 1
          fi
          
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME"
          
          # Build
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO
          
          # Find .app bundle
          APP_BUNDLE=$(find ./build -name "*.app" -type d 2>/dev/null | grep -v "\.framework" | grep -v "Pods" | head -1)
          
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ No .app bundle found"
            find ./build -type d -maxdepth 5 | head -20
            exit 1
          fi
          
          # Create IPA
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          zip -r app.ipa Payload
          rm -rf Payload
          
          if [ ! -f "app.ipa" ]; then
            echo "❌ IPA not created"
            exit 1
          fi
          
          echo "✅ IPA created: app.ipa"

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/ios/app.ipa
          retention-days: 30

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "📱 Unsigned IPA ready for download from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Sign manually with eSign before installing" >> $GITHUB_STEP_SUMMARY
