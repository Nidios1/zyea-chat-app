name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Build and create IPA
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Building iOS app and creating IPA..."
          
          # Find workspace and scheme
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          echo "✅ Workspace: $WORKSPACE"
          echo ""
          
          # List all schemes and find the app scheme (not EASClient or Pods)
          echo "📋 Available schemes:"
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Schemes:" || echo "Could not list schemes"
          echo ""
          
          # Get app scheme (usually the first one that's not EASClient or Pods)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Schemes:" | grep -v "Schemes:" | grep -v "EASClient" | grep -v "Pods" | head -1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            # Fallback: try to find scheme matching app name
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Schemes:" | grep -v "Schemes:" | grep -i "zyea\|mobile" | head -1 | xargs)
          fi
          
          if [ -z "$SCHEME" ]; then
            # Last resort: use first scheme
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          fi
          
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
          fi
          
          echo "✅ Using scheme: $SCHEME"
          echo ""
          
          # Clean
          echo "🧹 Cleaning..."
          rm -rf build || true
          
          # Build
          echo "🚀 Building app..."
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" 2>&1 | tee /tmp/build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "📋 Searching for errors in build log..."
            grep -i "error:" /tmp/build.log | tail -20 || echo "No errors found"
            echo ""
            echo "📋 Last 50 lines of build log:"
            tail -50 /tmp/build.log
            exit 1
          fi
          
          echo ""
          echo "✅ Build completed!"
          
          # Find .app - it should be in DerivedData/Build/Products/Release-iphoneos/
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ .app file not found!"
            echo "📂 Searching in build directory..."
            find build -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          
          # Create IPA
          echo "📦 Creating IPA..."
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_NAME" Payload/
          zip -r ../../../build.ipa Payload
          rm -rf Payload
          cd ../../../
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created: build.ipa"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi


      - name: ✅ Verify and move IPA
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "ios/build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          # Move IPA to mobile-expo root
          mv ios/build.ipa build.ipa
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
