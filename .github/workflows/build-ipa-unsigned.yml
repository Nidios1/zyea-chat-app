name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: pod install --repo-update || pod install

      - name: 🏗️ EAS Build iOS (Local)
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app with EAS Build (local)..."
          echo "📦 This will create IPA file directly, no need to find .app"
          
          # EAS Build with --local flag builds on GitHub Actions runner
          # and creates IPA file in ios/build/AppName.ipa
          set +e
          eas build -p ios \
            --profile unsigned \
            --local \
            --output build.tar.gz \
            --non-interactive 2>&1 | tee eas-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ EAS Build failed!"
            echo "📋 Last 100 lines of build log:"
            tail -100 eas-build.log || cat eas-build.log
            echo ""
            echo "📋 Searching for errors:"
            grep -i "error\|failed\|fatal" eas-build.log | tail -30 || echo "No specific errors found"
            exit 1
          fi
          
          if [ ! -f "build.tar.gz" ]; then
            echo "❌ Build failed: build.tar.gz not found"
            echo "📋 Build log:"
            cat eas-build.log || echo "No build log available"
            exit 1
          fi
          
          echo "✅ Build completed successfully"
          echo "📦 Extracting build artifact..."
          
          # Extract the build
          mkdir -p ios-build
          tar -xzf build.tar.gz -C ios-build
          
          echo "✅ Extraction completed"
          
          # Find IPA file (EAS creates it in ios/build/AppName.ipa)
          echo "🔍 Looking for IPA file..."
          IPA_PATH=$(find ios-build -name "*.ipa" -type f 2>/dev/null | head -1)
          
          if [ -z "$IPA_PATH" ]; then
            echo "⚠️ IPA not found in expected location, searching..."
            find ios-build -type f -name "*.ipa" 2>/dev/null || echo "No IPA found"
            exit 1
          fi
          
          echo "✅ Found IPA: $IPA_PATH"
          
          # Copy IPA to mobile-expo directory for upload
          cp "$IPA_PATH" build.ipa
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "✅ IPA ready! Size: $FILE_SIZE_MB MB"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
