name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            echo ""
            echo "💡 To fix this:"
            echo "   1. Go to your GitHub repository"
            echo "   2. Navigate to: Settings > Secrets and variables > Actions"
            echo "   3. Click 'New repository secret'"
            echo "   4. Name: EXPO_TOKEN"
            echo "   5. Value: Your Expo access token"
            echo ""
            echo "📖 Get your token from: https://expo.dev/accounts/[your-account]/settings/access-tokens"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install

      - name: 🏗️ Build IPA (unsigned) with expo run:ios
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app..."
          cd ios
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
          fi
          
          echo "✅ Using workspace: $WORKSPACE, scheme: $SCHEME"
          
          # Get app target name
          APP_TARGET=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Targets:" | grep -v "Targets:" | head -1 | xargs)
          if [ -z "$APP_TARGET" ]; then
            APP_TARGET="$SCHEME"
          fi
          echo "✅ App target: $APP_TARGET"
          
          echo "🧹 Cleaning build..."
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          echo "🏗️ Building app target first (unsigned)..."
          # Build app target first to ensure .app is created
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO || {
            echo "❌ Build failed!"
            exit 1
          }
          
          echo "✅ Build completed, checking for .app..."
          # Check if .app was created in DerivedData
          APP_IN_DERIVED=$(find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_IN_DERIVED" ]; then
            echo "⚠️ .app not found in DerivedData, trying archive..."
            # Try archive as fallback
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/app.xcarchive \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              SKIP_INSTALL=NO || {
              echo "❌ Archive also failed!"
              exit 1
            }
          fi
          
          echo "✅ Build process completed"
          cd ..
          
          echo "🔍 Finding .app file..."
          APP_PATH=""
          
          # Method 1: Check DerivedData/Build/Products first (where build puts it)
          APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          
          # Method 2: Check entire DerivedData
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          # Method 3: Check archive Products/Applications (if archive was created)
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products/Applications" ]; then
            APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          # Method 4: Check archive Products
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive" ]; then
            APP_PATH=$(find ios/build/app.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          # Method 5: Check ios/build directory
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          
          # Method 6: Search in ios directory
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | grep -v node_modules | grep -v ".expo" | head -1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file"
            echo "📂 Archive structure:"
            if [ -d "ios/build/app.xcarchive" ]; then
              echo "Archive exists!"
              ls -la ios/build/app.xcarchive/ 2>/dev/null || true
              echo ""
              echo "Products directory:"
              ls -la ios/build/app.xcarchive/Products/ 2>/dev/null || true
              echo ""
              echo "Applications directory:"
              ls -la ios/build/app.xcarchive/Products/Applications/ 2>/dev/null || true
            fi
            echo ""
            echo "📂 DerivedData structure:"
            find ios/build/DerivedData -type d -maxdepth 4 2>/dev/null | head -50 || true
            echo ""
            echo "📂 Build/Products directory:"
            ls -la ios/build/DerivedData/Build/Products/ 2>/dev/null || true
            echo ""
            echo "🔍 All .app files found:"
            find . -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 Creating IPA from $APP_PATH..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created successfully!"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: 🔍 Find IPA file
        working-directory: ./mobile-expo
        run: |
          echo "🔍 Searching for IPA file..."
          find . -name "*.ipa" -type f 2>/dev/null | head -5 || echo "No IPA files found yet"
          
      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          # Try to find IPA file in common locations
          IPA_FILE=""
          if [ -f "build.ipa" ]; then
            IPA_FILE="build.ipa"
          elif [ -f "ios/build/*.ipa" ]; then
            IPA_FILE=$(find ios/build -name "*.ipa" -type f | head -1)
          elif [ -f "*.ipa" ]; then
            IPA_FILE=$(find . -maxdepth 1 -name "*.ipa" -type f | head -1)
          else
            IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          fi
          
          if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
            echo "❌ Error: IPA file not found!"
            echo "📂 Current directory contents:"
            ls -la
            echo "📂 Searching in subdirectories:"
            find . -type f -name "*.ipa" 2>/dev/null || echo "No IPA files found"
            exit 1
          fi
          
          # If found file is not build.ipa, copy it
          if [ "$IPA_FILE" != "build.ipa" ]; then
            echo "📋 Found IPA at: $IPA_FILE"
            cp "$IPA_FILE" build.ipa
            echo "✅ Copied to build.ipa"
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small ($FILE_SIZE bytes). Expected at least 1MB."
            echo "📄 File type:"
            file build.ipa || echo "Could not determine file type"
            echo "📄 First 500 bytes (hex dump):"
            head -c 500 build.ipa | xxd | head -20 || head -c 500 build.ipa
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
