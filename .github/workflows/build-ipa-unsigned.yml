name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: pod install --repo-update || pod install

      - name: 🏗️ Build iOS App
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Building iOS app..."
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
          fi
          
          echo "✅ Using workspace: $WORKSPACE, scheme: $SCHEME"
          
          # Clean build
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          # Build app (creates .app in DerivedData)
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT"
            echo "📋 Last 50 lines of build output:"
            tail -50 build.log || cat build.log
            exit 1
          fi
          
          echo "✅ Build completed successfully"
          
          # Verify .app was created
          echo "🔍 Checking for .app file immediately after build..."
          find build/DerivedData -name "*.app" -type d 2>/dev/null | head -5 || echo "⚠️ No .app found yet"

      - name: 📦 Create IPA from Build
        working-directory: ./mobile-expo
        run: |
          echo "📦 Creating IPA from build..."
          
          # Find .app in DerivedData
          APP_PATH=""
          
          # Method 1: Check Release-iphoneos (most common)
          if [ -d "ios/build/DerivedData/Build/Products/Release-iphoneos" ]; then
            APP_PATH=$(find ios/build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in Release-iphoneos: $APP_PATH"
            fi
          fi
          
          # Method 2: Check entire Products directory
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData/Build/Products" ]; then
            APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in Products: $APP_PATH"
            fi
          fi
          
          # Method 3: Check entire DerivedData
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData" ]; then
            APP_PATH=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in DerivedData: $APP_PATH"
            fi
          fi
          
          # Method 4: Search entire ios/build
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found .app in ios/build: $APP_PATH"
            fi
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file"
            echo ""
            echo "📂 Current directory: $(pwd)"
            echo ""
            echo "📂 Checking ios/build structure:"
            if [ -d "ios/build" ]; then
              ls -la ios/build/ 2>/dev/null || true
            else
              echo "ios/build does not exist!"
            fi
            echo ""
            echo "📂 Checking DerivedData structure:"
            if [ -d "ios/build/DerivedData" ]; then
              echo "DerivedData exists"
              find ios/build/DerivedData -type d -maxdepth 3 2>/dev/null | head -30 || true
            else
              echo "DerivedData does not exist!"
            fi
            echo ""
            echo "📂 Checking Build directory:"
            if [ -d "ios/build/DerivedData/Build" ]; then
              ls -la ios/build/DerivedData/Build/ 2>/dev/null || true
            else
              echo "Build directory does not exist!"
            fi
            echo ""
            echo "📂 Checking Products directory:"
            if [ -d "ios/build/DerivedData/Build/Products" ]; then
              ls -la ios/build/DerivedData/Build/Products/ 2>/dev/null || true
              echo ""
              echo "📂 All subdirectories in Products:"
              find ios/build/DerivedData/Build/Products -type d -maxdepth 2 2>/dev/null || true
            else
              echo "Products directory does not exist!"
            fi
            echo ""
            echo "📂 Checking Release-iphoneos:"
            if [ -d "ios/build/DerivedData/Build/Products/Release-iphoneos" ]; then
              ls -la ios/build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || true
            else
              echo "Release-iphoneos directory does not exist!"
            fi
            echo ""
            echo "🔍 Searching for ALL .app files recursively:"
            find ios -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found anywhere in ios/"
            echo ""
            echo "🔍 Searching in entire mobile-expo directory:"
            find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found anywhere"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          
          # Create Payload directory and copy .app
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          
          # Create IPA
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ ! -f "build.ipa" ]; then
            echo "❌ Failed to create IPA"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "✅ IPA created successfully! Size: $FILE_SIZE_MB MB"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
