name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'unsigned'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: ./mobile-expo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile-expo
        run: |
          echo "📦 Installing dependencies..."
          npm install --legacy-peer-deps || npm install
          echo "✅ Dependencies installed"
          # Verify react-native-worklets is installed
          npm list react-native-worklets || echo "⚠️ react-native-worklets not found in node_modules"

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest

      - name: Setup CocoaPods
        run: |
          echo "☕️ Setting up CocoaPods..."
          sudo gem install cocoapods
          pod --version

      - name: Generate iOS project
        run: |
          echo "🔨 Generating iOS project with Expo..."
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          # Clean CocoaPods cache first
          pod cache clean --all || true
          # Update repo
          pod repo update || true
          # Install pods
          pod install --repo-update || pod install
          
          # Verify pods were installed
          if [ ! -d "Pods" ]; then
            echo "❌ ERROR: Pods directory not found after installation"
            exit 1
          fi
          echo "✅ CocoaPods dependencies installed"

      - name: Prepare codegen (if needed)
        working-directory: ./mobile-expo
        run: |
          echo "🔨 Preparing for codegen generation..."
          # Codegen will be generated automatically during Xcode build
          # Just ensure node_modules are properly set up
          if [ ! -d "node_modules/@react-native/codegen" ]; then
            echo "⚠️ @react-native/codegen not found, reinstalling..."
            npm install --legacy-peer-deps
          fi
          echo "✅ Codegen preparation completed"

      - name: Prepare build environment
        working-directory: ./mobile-expo/ios
        run: |
          echo "🔨 Preparing build environment..."
          # Create build directory
          mkdir -p ./build
          
          # Find workspace
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace: $WORKSPACE"
            
            # List all available schemes to find ReactCodegen
            echo "Available schemes:"
            xcodebuild -list -workspace "$WORKSPACE" || true
            
            # Try to build ReactCodegen target first to generate codegen files
            # This is optional - codegen will be generated during main build if needed
            echo "Attempting to build ReactCodegen target to pre-generate codegen files..."
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "ReactCodegen" \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              -derivedDataPath ./build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              -allowProvisioningUpdates \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -quiet \
              || {
                echo "⚠️ ReactCodegen scheme not found or build failed (this is OK, codegen will be generated during main build)"
                # Check if codegen files were generated anyway
                if [ -d "./build/Build/Products/Release-iphoneos" ]; then
                  echo "✅ Build products directory exists"
                fi
              }
          fi
          
          echo "✅ Build environment prepared"

      - name: Find app target and scheme
        working-directory: ./mobile-expo/ios
        id: find_targets
        run: |
          echo "🔍 Searching for Xcode project files..."
          ls -la
          
          # Find .xcworkspace or .xcodeproj
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 1 | head -1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "✅ Found workspace: $WORKSPACE"
            echo "workspace_path=$WORKSPACE" >> $GITHUB_OUTPUT
            
            # Get scheme (usually same as workspace name without extension)
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            echo "scheme_name=$SCHEME" >> $GITHUB_OUTPUT
            
            # Get app target (first target that's not Pods/Expo/Test)
            TARGET=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | \
              grep -A 100 "Targets:" | \
              grep -v "Targets:" | \
              grep -v "Pods" | \
              grep -v "^Expo$" | \
              grep -v "Test" | \
              head -1 | xargs)
            
            if [ -z "$TARGET" ]; then
              echo "⚠️ Could not find target from workspace, trying schemes..."
              SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
              if [ -n "$SCHEMES" ]; then
                TARGET="$SCHEMES"
                echo "Using scheme as target: $TARGET"
              fi
            fi
            
            echo "target_name=$TARGET" >> $GITHUB_OUTPUT
          elif [ -n "$PROJECT" ]; then
            echo "✅ Found project: $PROJECT"
            echo "project_path=$PROJECT" >> $GITHUB_OUTPUT
            
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            echo "scheme_name=$SCHEME" >> $GITHUB_OUTPUT
            
            TARGET=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | \
              grep -A 100 "Targets:" | \
              grep -v "Targets:" | \
              grep -v "Pods" | \
              grep -v "^Expo$" | \
              grep -v "Test" | \
              head -1 | xargs)
            
            if [ -z "$TARGET" ]; then
              TARGET="$SCHEME"
              echo "Using project name as target: $TARGET"
            fi
            
            echo "target_name=$TARGET" >> $GITHUB_OUTPUT
          else
            echo "❌ ERROR: No .xcworkspace or .xcodeproj found!"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          
          echo "📱 Scheme: $SCHEME"
          echo "📱 Target: $TARGET"
          
          if [ -z "$SCHEME" ] || [ -z "$TARGET" ]; then
            echo "❌ ERROR: Could not determine scheme or target"
            exit 1
          fi

      - name: Build IPA (unsigned)
        working-directory: ./mobile-expo/ios
        id: build
        run: |
          WORKSPACE="${{ steps.find_targets.outputs.workspace_path }}"
          PROJECT="${{ steps.find_targets.outputs.project_path }}"
          SCHEME="${{ steps.find_targets.outputs.scheme_name }}"
          TARGET="${{ steps.find_targets.outputs.target_name }}"
          
          echo "🔨 Building unsigned IPA..."
          echo "Scheme: $SCHEME"
          echo "Target: $TARGET"
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJECT"
          
          # Don't clean build directory completely - keep codegen files
          # Only clean Build products, not generated files
          if [ -d "./build/Build" ]; then
            rm -rf ./build/Build
          fi
          mkdir -p ./build
          
          # Set build log file
          BUILD_LOG="./build/xcodebuild.log"
          
          # Build: use -scheme for workspace, -target for project
          if [ -n "$WORKSPACE" ]; then
            echo "Building with workspace and scheme..."
            set -o pipefail
            
            # Build main app - dependencies will be built automatically
            # This should trigger codegen generation as part of build process
            # Use build-for-testing first to ensure all dependencies are built, then archive
            echo "Building all dependencies first..."
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              -derivedDataPath ./build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              ONLY_ACTIVE_ARCH=NO \
              CLANG_ENABLE_MODULES=YES \
              ENABLE_BITCODE=NO \
              -allowProvisioningUpdates \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              GENERATE_INFOPLIST_FILE=YES \
              2>&1 | tee "$BUILD_LOG" || {
                echo "❌ Build failed with exit code $?"
                echo "Last 100 lines of build log:"
                tail -100 "$BUILD_LOG" || true
                echo "Searching for errors in build log:"
                grep -i "error:" "$BUILD_LOG" | tail -20 || true
                echo "Checking for codegen files:"
                find ./build -name "*generated*" -type f 2>/dev/null | head -10 || true
                exit 1
              }
          else
            echo "Building with project and target..."
            set -o pipefail
            xcodebuild build \
              -project "$PROJECT" \
              -target "$TARGET" \
              -configuration Release \
              -sdk iphoneos \
              -arch arm64 \
              -derivedDataPath ./build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              ONLY_ACTIVE_ARCH=NO \
              CLANG_ENABLE_MODULES=YES \
              ENABLE_BITCODE=NO \
              -allowProvisioningUpdates \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              GENERATE_INFOPLIST_FILE=YES \
              2>&1 | tee "$BUILD_LOG" || {
                echo "❌ Build failed with exit code $?"
                echo "Last 100 lines of build log:"
                tail -100 "$BUILD_LOG" || true
                echo "Searching for errors in build log:"
                grep -i "error:" "$BUILD_LOG" | tail -20 || true
                exit 1
              }
          fi
          
          echo "✅ Build completed successfully"
          
          # Find .app bundle
          APP_BUNDLE=$(find build -name "*.app" -type d 2>/dev/null | \
            grep -v "\.framework" | \
            grep -v "Pods" | \
            head -1)
          
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "❌ ERROR: No .app bundle found!"
            echo "Build directory structure:"
            find build -type d -maxdepth 5 2>/dev/null | head -30
            echo "All .app files:"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          
          echo "✅ Found .app bundle: $APP_BUNDLE"
          
          # Create IPA
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          zip -r -q app.ipa Payload
          
          echo "✅ IPA created: app.ipa"
          echo "ipa_path=app.ipa" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/ios/app.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You will need to sign it manually with eSign or another tool before installing." >> $GITHUB_STEP_SUMMARY
