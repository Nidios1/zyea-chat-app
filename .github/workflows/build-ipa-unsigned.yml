name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write  # Required to commit ios/ folder back to repo
      actions: read
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history needed for commits

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            echo ""
            echo "💡 To fix this:"
            echo "   1. Go to your GitHub repository"
            echo "   2. Navigate to: Settings > Secrets and variables > Actions"
            echo "   3. Click 'New repository secret'"
            echo "   4. Name: EXPO_TOKEN"
            echo "   5. Value: Your Expo access token"
            echo ""
            echo "📖 Get your token from: https://expo.dev/accounts/[your-account]/settings/access-tokens"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          echo "📂 Current directory: $(pwd)"
          echo "📂 Checking if ios/ exists before prebuild:"
          ls -la ios/ 2>/dev/null || echo "ios/ does not exist yet"
          
          echo "🧹 Cleaning any existing ios/ folder..."
          rm -rf ios/ || true
          
          echo "🏗️ Running expo prebuild for iOS..."
          npx expo prebuild --platform ios --clean --no-install
          
          echo "✅ Prebuild completed"
          echo "📂 Verifying ios/ folder structure:"
          if [ -d "ios" ]; then
            echo "✅ ios/ folder exists"
            ls -la ios/ | head -20
            echo ""
            echo "📂 Looking for .xcworkspace:"
            find ios/ -name "*.xcworkspace" -type d | head -5 || echo "No .xcworkspace found"
            echo ""
            echo "📂 Looking for .xcodeproj:"
            find ios/ -name "*.xcodeproj" -type d | head -5 || echo "No .xcodeproj found"
          else
            echo "❌ ERROR: ios/ folder was not created by prebuild!"
            exit 1
          fi

      - name: 💾 Commit ios/ folder to repository (optional)
        working-directory: ./mobile-expo
        run: |
          # Check if ios/ folder has changes
          if git diff --quiet ios/ 2>/dev/null && git diff --cached --quiet ios/ 2>/dev/null; then
            echo "ℹ️  ios/ folder has no changes, skipping commit"
          else
            echo "📝 ios/ folder has changes, committing..."
            
            # Configure git
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # Add ios/ folder (excluding build artifacts)
            git add ios/ || true
            
            # Check if there are staged changes
            if git diff --cached --quiet; then
              echo "ℹ️  No changes to commit in ios/ folder"
            else
              # Commit the changes
              git commit -m "chore: Auto-generate iOS native folder from prebuild [skip ci]" || echo "⚠️  Commit failed (may already be committed)"
              
              # Push the changes
              git push origin HEAD:main || echo "⚠️  Push failed (may need manual push)"
              
              echo "✅ ios/ folder committed and pushed successfully"
            fi
          fi

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          pod install --repo-update || pod install
          
          echo "✅ CocoaPods installation completed"
          echo "📂 Verifying Pods installation:"
          if [ -d "Pods" ]; then
            echo "✅ Pods directory exists"
            ls -la Pods/ | head -10
          else
            echo "❌ Pods directory not found!"
            exit 1
          fi

      - name: 🔧 Generate React Native Codegen files
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔧 Generating React Native codegen files..."
          echo "📂 Creating generated files directory structure..."
          mkdir -p ios/build/generated/ios/safeareacontext
          mkdir -p ios/build/generated/ios/rnworklets
          
          echo "🏗️ Running initial build to generate codegen files..."
          cd ios
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            APP_SLUG=$(node -e "console.log(require('../app.json').expo.slug)" 2>/dev/null || echo "")
            SCHEME="${APP_SLUG:-zyea-mobile}"
          fi
          
          echo "✅ Using scheme: $SCHEME"
          
          # Build ReactCodegen target first to generate files
          echo "🔧 Building ReactCodegen target to generate files..."
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -target ReactCodegen \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" 2>&1 | grep -E "(error|warning|succeeded|failed)" | head -50 || true
          set -e
          
          echo "📂 Checking generated files..."
          find build -name "*generated*" -type f 2>/dev/null | head -10 || echo "No generated files found yet"
          
          cd ..
          echo "✅ Codegen preparation completed"

      - name: 🏗️ Build IPA (unsigned) using Archive
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app using Archive method..."
          cd ios
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            echo "📂 Current directory contents:"
            ls -la
            echo "📂 Searching for workspace files:"
            find . -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found workspace: $WORKSPACE"
          
          echo "📋 Listing all available schemes:"
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null || echo "Could not list schemes"
          
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            # Try to get scheme from app.json slug or use default
            APP_SLUG=$(node -e "console.log(require('../app.json').expo.slug)" 2>/dev/null || echo "")
            if [ -n "$APP_SLUG" ]; then
              SCHEME="$APP_SLUG"
              echo "⚠️ Could not detect scheme, using app.json slug: $SCHEME"
            else
              SCHEME="zyea-mobile"
              echo "⚠️ Could not detect scheme, using default: $SCHEME"
            fi
          fi
          
          echo "✅ Using workspace: $WORKSPACE, scheme: $SCHEME"
          
          # Verify scheme exists
          SCHEME_EXISTS=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -c "$SCHEME" || echo "0")
          if [ "$SCHEME_EXISTS" -eq 0 ]; then
            echo "❌ ERROR: Scheme '$SCHEME' not found in workspace!"
            echo "📋 Available schemes:"
            xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Schemes:" || echo "Could not list schemes"
            exit 1
          fi
          
          echo "🧹 Cleaning previous builds (but keeping generated files)..."
          # Keep generated files directory
          if [ -d "build/generated" ]; then
            echo "📂 Preserving generated files..."
            mkdir -p ../generated_backup
            cp -r build/generated ../generated_backup/ || true
          fi
          
          rm -rf build/ || true
          mkdir -p build
          
          # Restore generated files if they exist
          if [ -d "../generated_backup/generated" ]; then
            echo "📂 Restoring generated files..."
            cp -r ../generated_backup/generated build/ || true
            rm -rf ../generated_backup || true
          fi
          
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          echo "🏗️ Creating Archive (this will take a while)..."
          BUILD_OUTPUT=$(mktemp)
          set +e
          
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" 2>&1 | tee "$BUILD_OUTPUT"
          ARCHIVE_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $ARCHIVE_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Archive failed with exit code: $ARCHIVE_EXIT_CODE"
            echo ""
            echo "📋 Last 100 lines of build output:"
            tail -100 "$BUILD_OUTPUT" || cat "$BUILD_OUTPUT"
            echo ""
            echo "📋 Searching for error patterns:"
            grep -i "error:" "$BUILD_OUTPUT" | tail -30 || echo "No error patterns found"
            echo ""
            echo "📋 Searching for warning patterns:"
            grep -i "warning:" "$BUILD_OUTPUT" | tail -15 || echo "No warning patterns found"
            rm -f "$BUILD_OUTPUT"
            exit 1
          fi
          
          rm -f "$BUILD_OUTPUT"
          echo "✅ Archive created successfully!"
          
          # Verify archive exists
          if [ ! -d "build/app.xcarchive" ]; then
            echo "❌ ERROR: Archive file not found at build/app.xcarchive"
            echo "📂 Build directory contents:"
            ls -la build/ || true
            exit 1
          fi
          
          echo "📂 Archive structure:"
          ls -la build/app.xcarchive/ || true
          echo ""
          echo "📂 Products/Applications:"
          ls -la build/app.xcarchive/Products/Applications/ || true
          
          cd ..
          
      - name: 📦 Export IPA from Archive
        working-directory: ./mobile-expo
        run: |
          echo "📦 Exporting IPA from archive..."
          
          # Find .app in archive
          APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file in archive!"
            echo "📂 Archive structure:"
            ls -la ios/build/app.xcarchive/ 2>/dev/null || echo "Archive does not exist"
            echo ""
            echo "📂 Products directory:"
            ls -la ios/build/app.xcarchive/Products/ 2>/dev/null || true
            echo ""
            echo "📂 Applications directory:"
            ls -la ios/build/app.xcarchive/Products/Applications/ 2>/dev/null || true
            echo ""
            echo "🔍 Searching for .app files:"
            find ios/build/app.xcarchive -name "*.app" -type d 2>/dev/null || echo "No .app files found"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App details:"
          ls -lh "$APP_PATH" | head -10
          echo ""
          
          # Create IPA
          echo "📦 Creating IPA..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          
          echo "📦 Zipping IPA..."
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ -f "build.ipa" ]; then
            FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
            FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
            echo "✅ IPA created successfully!"
            echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: 🔍 Find IPA file
        working-directory: ./mobile-expo
        run: |
          echo "🔍 Searching for IPA file..."
          find . -name "*.ipa" -type f 2>/dev/null | head -5 || echo "No IPA files found yet"
          
      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          # Try to find IPA file in common locations
          IPA_FILE=""
          if [ -f "build.ipa" ]; then
            IPA_FILE="build.ipa"
          elif [ -f "ios/build/*.ipa" ]; then
            IPA_FILE=$(find ios/build -name "*.ipa" -type f | head -1)
          elif [ -f "*.ipa" ]; then
            IPA_FILE=$(find . -maxdepth 1 -name "*.ipa" -type f | head -1)
          else
            IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          fi
          
          if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
            echo "❌ Error: IPA file not found!"
            echo "📂 Current directory contents:"
            ls -la
            echo "📂 Searching in subdirectories:"
            find . -type f -name "*.ipa" 2>/dev/null || echo "No IPA files found"
            exit 1
          fi
          
          # If found file is not build.ipa, copy it
          if [ "$IPA_FILE" != "build.ipa" ]; then
            echo "📋 Found IPA at: $IPA_FILE"
            cp "$IPA_FILE" build.ipa
            echo "✅ Copied to build.ipa"
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small ($FILE_SIZE bytes). Expected at least 1MB."
            echo "📄 File type:"
            file build.ipa || echo "Could not determine file type"
            echo "📄 First 500 bytes (hex dump):"
            head -c 500 build.ipa | xxd | head -20 || head -c 500 build.ipa
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
