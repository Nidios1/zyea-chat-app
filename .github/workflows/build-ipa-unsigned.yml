name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Build IPA with EAS Build (unsigned)
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building IPA with EAS Build (unsigned profile)..."
          echo "📋 Using EAS Build with profile 'unsigned' (withoutCredentials: true)"
          echo ""
          
          # Build with EAS Build - this handles React Native/Expo properly
          # --local flag builds on GitHub Actions runner (macOS)
          # --non-interactive to avoid prompts
          # --output to specify output file
          eas build --platform ios \
            --profile unsigned \
            --local \
            --non-interactive \
            --output build.ipa
          
          BUILD_EXIT_CODE=$?
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ EAS Build failed with exit code: $BUILD_EXIT_CODE"
            exit 1
          fi
          
          echo ""
          echo "✅ EAS Build completed successfully!"
          
          # Verify IPA was created
          if [ -f "build.ipa" ]; then
            echo "✅ IPA file created at: build.ipa"
            ls -lh build.ipa
          else
            echo "❌ IPA file not found!"
            echo "📂 Checking for build artifacts..."
            find . -name "*.ipa" -type f 2>/dev/null | head -5 || echo "No IPA files found"
            exit 1
          fi


      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
