name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Build iOS app with expo run:ios
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app with expo run:ios..."
          echo "📋 This will build Release configuration for device..."
          echo ""
          
          # Build using expo run:ios - this handles React Native/Expo properly
          # Use --no-install to skip device installation
          # Use --configuration Release for production build
          # Use --device to build for physical device (creates .app)
          npx expo run:ios \
            --configuration Release \
            --no-install \
            --device \
            --no-build-cache
          
          BUILD_EXIT_CODE=$?
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            exit 1
          fi
          
          echo ""
          echo "✅ Build completed successfully!"

      - name: 📦 Find .app and create IPA
        working-directory: ./mobile-expo
        run: |
          echo "🔍 Searching for .app file after expo run:ios build..."
          echo "Current directory: $(pwd)"
          echo ""
          
          APP_PATH=""
          
          # Method 1: Check ios/build/DerivedData/Build/Products/Release-iphoneos/ (expo run:ios output)
          if [ -d "ios/build/DerivedData/Build/Products/Release-iphoneos" ]; then
            APP_PATH=$(find ios/build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 1 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 1 (Release-iphoneos): $APP_PATH"
            fi
          fi
          
          # Method 2: Check entire DerivedData/Build/Products
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData/Build/Products" ]; then
            APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 2 (Products): $APP_PATH"
            fi
          fi
          
          # Method 3: Check entire DerivedData
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData" ]; then
            APP_PATH=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 3 (DerivedData): $APP_PATH"
            fi
          fi
          
          # Method 4: Check ios/build directory
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 4 (ios/build): $APP_PATH"
            fi
          fi
          
          # Method 5: Search entire ios directory
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | grep -v node_modules | grep -v ".expo" | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 5 (ios directory): $APP_PATH"
            fi
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file!"
            echo ""
            echo "📂 Debugging information:"
            echo "Current directory: $(pwd)"
            echo ""
            echo "📂 Checking ios/build structure:"
            ls -la ios/build/ 2>/dev/null || echo "ios/build does not exist"
            echo ""
            echo "📂 Checking DerivedData:"
            ls -la ios/build/DerivedData/ 2>/dev/null || echo "DerivedData does not exist"
            echo ""
            echo "📂 Checking Build/Products:"
            ls -la ios/build/DerivedData/Build/Products/ 2>/dev/null || echo "Products does not exist"
            echo ""
            echo "📂 Checking Release-iphoneos:"
            ls -la ios/build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Release-iphoneos does not exist"
            echo ""
            echo "📂 All directories in Products:"
            find ios/build/DerivedData/Build/Products -type d -maxdepth 2 2>/dev/null | head -20 || true
            echo ""
            echo "📂 All .app files in entire project:"
            find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found"
            exit 1
          fi
          
          echo ""
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App details:"
          ls -lh "$APP_PATH" | head -5
          echo ""
          
          # Create IPA
          echo "📦 Creating IPA file..."
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_NAME" Payload/
          zip -r ../../../build.ipa Payload
          rm -rf Payload
          cd ../../../
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created successfully!"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
