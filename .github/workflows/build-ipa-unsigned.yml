name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: pod install --repo-update || pod install

      - name: 🏗️ Build iOS App with Expo
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app with expo run:ios..."
          echo "📦 This will build the app and create .app in ios/build"
          
          # expo run:ios builds the app and creates .app in ios/build/Build/Products
          # Use --configuration Release and --no-install to just build without installing
          set +e
          npx expo run:ios \
            --configuration Release \
            --device \
            --no-install \
            --no-build-cache 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          
          # expo run:ios may exit with non-zero if it can't find device, but build might still succeed
          # Check if .app was created instead
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "⚠️ expo run:ios exited with code $BUILD_EXIT"
            echo "📋 Checking if build actually succeeded by looking for .app..."
          fi
          
          # Check if .app was created
          APP_FOUND=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_FOUND" ]; then
            echo "✅ Found .app: $APP_FOUND"
            echo "✅ Build succeeded (app was created)"
          else
            echo "❌ Build failed: .app not found"
            echo "📋 Build log errors:"
            grep -i "error\|failed" build.log | tail -30 || echo "No errors found"
            echo ""
            echo "📋 Last 50 lines:"
            tail -50 build.log || cat build.log
            exit 1
          fi

      - name: 📦 Find .app and Create IPA
        working-directory: ./mobile-expo
        run: |
          echo "📦 Finding .app and creating IPA..."
          
          APP_PATH=""
          
          # Priority 1: Check ios/build (expo run:ios creates .app here)
          if [ -d "ios/build" ]; then
            echo "📂 Checking ios/build (Priority 1)..."
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found in ios/build: $APP_PATH"
            fi
          fi
          
          # Priority 2: Check DerivedData Products (xcodebuild creates .app here)
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData/Build/Products" ]; then
            echo "📂 Checking DerivedData Products (Priority 2)..."
            # Check all subdirectories in Products
            for subdir in ios/build/DerivedData/Build/Products/*/; do
              if [ -d "$subdir" ]; then
                FOUND=$(find "$subdir" -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
                if [ -n "$FOUND" ]; then
                  APP_PATH="$FOUND"
                  echo "✅ Found in $(basename "$subdir"): $APP_PATH"
                  break
                fi
              fi
            done
            # If not found in subdirs, search recursively
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
              if [ -n "$APP_PATH" ]; then
                echo "✅ Found in Products (recursive): $APP_PATH"
              fi
            fi
          fi
          
          # Priority 3: Search entire ios/build
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            echo "📂 Searching entire ios/build (Priority 3)..."
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found in ios/build: $APP_PATH"
            fi
          fi
          
          # Final check
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "❌ ERROR: Could not find .app file!"
            echo ""
            echo "📂 Debug information:"
            echo "Current directory: $(pwd)"
            echo ""
            echo "📂 DerivedData structure:"
            if [ -d "build/DerivedData" ]; then
              echo "DerivedData exists"
              echo ""
              echo "📂 Build directory:"
              ls -la build/DerivedData/Build/ 2>/dev/null || echo "Build directory not found"
              echo ""
              echo "📂 Products directory:"
              if [ -d "build/DerivedData/Build/Products" ]; then
                ls -la build/DerivedData/Build/Products/ 2>/dev/null || true
                echo ""
                echo "📂 All subdirectories in Products:"
                find build/DerivedData/Build/Products -type d -maxdepth 1 2>/dev/null || true
                echo ""
                echo "📂 Contents of each subdirectory:"
                for subdir in build/DerivedData/Build/Products/*/; do
                  if [ -d "$subdir" ]; then
                    echo "--- $(basename "$subdir") ---"
                    ls -la "$subdir" 2>/dev/null | head -10 || true
                  fi
                done
              else
                echo "Products directory does not exist!"
              fi
              echo ""
              echo "🔍 Recursive search in DerivedData:"
              find build/DerivedData -type d -name "*.app" 2>/dev/null || echo "No .app found"
            else
              echo "DerivedData does not exist!"
            fi
            echo ""
            echo "🔍 All .app files in project:"
            find . -name "*.app" -type d 2>/dev/null | head -10 || echo "None found"
            exit 1
          fi
          
          echo ""
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App size:"
          du -sh "$APP_PATH" || true
          
          # Create IPA
          echo ""
          echo "📦 Creating IPA..."
          mkdir -p ios/build/Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "ios/build/Payload/$APP_NAME"
          
          cd ios/build
          zip -r ../build.ipa Payload
          cd ../..
          rm -rf ios/build/Payload
          
          if [ ! -f "ios/build.ipa" ]; then
            echo "❌ Failed to create IPA"
            exit 1
          fi
          
          # Move IPA to mobile-expo root for upload
          mv ios/build.ipa build.ipa
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "✅ IPA created! Size: $FILE_SIZE_MB MB"
          echo "📦 IPA location: $(pwd)/build.ipa"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
