name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            echo ""
            echo "💡 To fix this:"
            echo "   1. Go to your GitHub repository"
            echo "   2. Navigate to: Settings > Secrets and variables > Actions"
            echo "   3. Click 'New repository secret'"
            echo "   4. Name: EXPO_TOKEN"
            echo "   5. Value: Your Expo access token"
            echo ""
            echo "📖 Get your token from: https://expo.dev/accounts/[your-account]/settings/access-tokens"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          # Clean CocoaPods cache if needed
          pod cache clean --all 2>/dev/null || true
          # Update repo and install
          pod repo update || true
          pod install --repo-update || pod install
          echo "✅ CocoaPods dependencies installed"
          
          # Verify Podfile.lock exists
          if [ ! -f "Podfile.lock" ]; then
            echo "⚠️ Warning: Podfile.lock not found, this might cause build issues"
          else
            echo "✅ Podfile.lock found"
          fi
          
          # List installed pods
          echo "📋 Installed pods:"
          pod list 2>/dev/null | head -20 || echo "Could not list pods"

      - name: 🏗️ Build IPA (unsigned) with expo run:ios
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app..."
          cd ios
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            echo "📂 Current directory contents:"
            ls -la
            echo "📂 Searching for workspace files:"
            find . -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found workspace: $WORKSPACE"
          
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
            echo "⚠️ Could not detect scheme, using default: $SCHEME"
          fi
          
          echo "✅ Using workspace: $WORKSPACE, scheme: $SCHEME"
          
          # Get app target name
          APP_TARGET=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 20 "Targets:" | grep -v "Targets:" | head -1 | xargs)
          if [ -z "$APP_TARGET" ]; then
            APP_TARGET="$SCHEME"
          fi
          echo "✅ App target: $APP_TARGET"
          
          echo "🧹 Cleaning build..."
          rm -rf build/DerivedData || true
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          echo "🏗️ Building app target (unsigned)..."
          echo "📋 Build command:"
          echo "xcodebuild build -workspace \"$WORKSPACE\" -scheme \"$SCHEME\" -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM=\"\" ONLY_ACTIVE_ARCH=NO ARCHS=\"arm64\""
          
          # Build with better error handling
          BUILD_OUTPUT=$(mktemp)
          # Ensure cleanup on exit
          trap "rm -f '$BUILD_OUTPUT' 2>/dev/null || true" EXIT
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            -allowProvisioningUpdates \
            -quiet 2>&1 | tee "$BUILD_OUTPUT"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "📋 Error details from build output:"
            echo "=========================================="
            # Show errors from build output
            grep -i "error:" "$BUILD_OUTPUT" | tail -20 || echo "No error messages found in standard format"
            echo ""
            echo "📋 Last 100 lines of build output:"
            echo "=========================================="
            tail -100 "$BUILD_OUTPUT" || cat "$BUILD_OUTPUT"
            echo ""
            echo "📋 Checking for build logs..."
            if [ -d "build/DerivedData/Logs/Build" ]; then
              echo "📂 Build log files:"
              ls -la build/DerivedData/Logs/Build/ 2>/dev/null || true
              echo ""
              echo "📋 Recent build log (last 200 lines):"
              find build/DerivedData/Logs/Build -name "*.xcactivitylog" -type f -mmin -10 | head -1 | xargs -I {} sh -c 'gunzip -c "{}" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null | tail -200 || echo "Could not read log"' || true
            fi
            echo ""
            echo "🔍 Common issues to check:"
            echo "  1. Missing dependencies in Podfile"
            echo "  2. CocoaPods installation issues"
            echo "  3. Xcode version compatibility"
            echo "  4. Missing required frameworks"
            rm -f "$BUILD_OUTPUT"
            exit 1
          fi
          
          rm -f "$BUILD_OUTPUT"
          trap - EXIT
          echo "✅ Build command completed successfully"
          
          echo "🔍 Checking for .app file immediately after build..."
          echo "📂 DerivedData structure:"
          find build/DerivedData -type d -maxdepth 5 2>/dev/null | head -30 || true
          echo ""
          echo "📂 Build/Products directory:"
          ls -la build/DerivedData/Build/Products/ 2>/dev/null || echo "Products directory does not exist"
          echo ""
          echo "📂 Looking for Release-iphoneos:"
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Release-iphoneos directory does not exist"
          echo ""
          
          # Check if .app was created in DerivedData
          APP_IN_DERIVED=$(find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
          
          if [ -z "$APP_IN_DERIVED" ]; then
            echo "⚠️ .app not found in DerivedData/Build/Products, trying archive method..."
            # Try archive as fallback
            ARCHIVE_OUTPUT=$(mktemp)
            trap "rm -f '$ARCHIVE_OUTPUT' 2>/dev/null || true" EXIT
            set +e
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -archivePath build/app.xcarchive \
              -sdk iphoneos \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              PROVISIONING_PROFILE="" \
              SKIP_INSTALL=NO \
              ARCHS="arm64" \
              -allowProvisioningUpdates \
              -quiet 2>&1 | tee "$ARCHIVE_OUTPUT"
            ARCHIVE_EXIT_CODE=${PIPESTATUS[0]}
            set -e
            
            if [ $ARCHIVE_EXIT_CODE -ne 0 ]; then
              echo "❌ Archive also failed with exit code: $ARCHIVE_EXIT_CODE"
              echo ""
              echo "📋 Error details from archive output:"
              grep -i "error:" "$ARCHIVE_OUTPUT" | tail -20 || echo "No error messages found"
              echo ""
              echo "📋 Last 100 lines of archive output:"
              tail -100 "$ARCHIVE_OUTPUT" || cat "$ARCHIVE_OUTPUT"
              rm -f "$ARCHIVE_OUTPUT"
              trap - EXIT
              exit 1
            fi
            rm -f "$ARCHIVE_OUTPUT"
            trap - EXIT
            echo "✅ Archive completed"
          else
            echo "✅ Found .app in DerivedData: $APP_IN_DERIVED"
          fi
          
          echo "✅ Build process completed"
          cd ..
          
          echo "🔍 Finding .app file from mobile-expo directory..."
          pwd
          APP_PATH=""
          
          # Method 1: Check DerivedData/Build/Products first (where build puts it)
          if [ -d "ios/build/DerivedData/Build/Products" ]; then
            echo "📂 Checking ios/build/DerivedData/Build/Products..."
            APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 1: $APP_PATH"
            fi
          fi
          
          # Method 2: Check entire DerivedData
          if [ -z "$APP_PATH" ] && [ -d "ios/build/DerivedData" ]; then
            echo "📂 Checking entire ios/build/DerivedData..."
            APP_PATH=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 2: $APP_PATH"
            fi
          fi
          
          # Method 3: Check archive Products/Applications (if archive was created)
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products/Applications" ]; then
            echo "📂 Checking archive Products/Applications..."
            APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 3: $APP_PATH"
            fi
          fi
          
          # Method 4: Check archive Products
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive" ]; then
            echo "📂 Checking archive Products..."
            APP_PATH=$(find ios/build/app.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 4: $APP_PATH"
            fi
          fi
          
          # Method 5: Check ios/build directory
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            echo "📂 Checking ios/build directory..."
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 5: $APP_PATH"
            fi
          fi
          
          # Method 6: Search in ios directory
          if [ -z "$APP_PATH" ]; then
            echo "📂 Searching entire ios directory..."
            APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | grep -v node_modules | grep -v ".expo" | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 6: $APP_PATH"
            fi
          fi
          
          # Method 7: Search from current directory (mobile-expo)
          if [ -z "$APP_PATH" ]; then
            echo "📂 Searching from current directory..."
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v node_modules | grep -v ".expo" | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via Method 7: $APP_PATH"
            fi
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file after exhaustive search"
            echo ""
            echo "📂 Debugging information:"
            echo "Current directory: $(pwd)"
            echo ""
            echo "📂 ios/build structure:"
            ls -la ios/build/ 2>/dev/null || echo "ios/build does not exist"
            echo ""
            echo "📂 Archive structure:"
            if [ -d "ios/build/app.xcarchive" ]; then
              echo "Archive exists!"
              ls -la ios/build/app.xcarchive/ 2>/dev/null || true
              echo ""
              echo "Products directory:"
              ls -la ios/build/app.xcarchive/Products/ 2>/dev/null || true
              echo ""
              echo "Applications directory:"
              ls -la ios/build/app.xcarchive/Products/Applications/ 2>/dev/null || true
            else
              echo "Archive does not exist"
            fi
            echo ""
            echo "📂 DerivedData structure (first 50 dirs):"
            find ios/build/DerivedData -type d -maxdepth 4 2>/dev/null | head -50 || echo "DerivedData does not exist"
            echo ""
            echo "📂 Build/Products directory:"
            ls -la ios/build/DerivedData/Build/Products/ 2>/dev/null || echo "Products directory does not exist"
            echo ""
            echo "📂 Release-iphoneos directory:"
            ls -la ios/build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Release-iphoneos does not exist"
            echo ""
            echo "🔍 All .app files found in entire project:"
            find . -name "*.app" -type d 2>/dev/null | head -20 || echo "No .app files found anywhere"
            echo ""
            echo "🔍 All directories in ios/build/DerivedData/Build:"
            find ios/build/DerivedData/Build -type d -maxdepth 3 2>/dev/null | head -30 || true
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App details:"
          ls -lh "$APP_PATH" | head -10
          echo ""
          echo "📦 Creating IPA from $APP_PATH..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created successfully!"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: 🧹 Cleanup build artifacts
        working-directory: ./mobile-expo
        run: |
          echo "🧹 Cleaning up build artifacts..."
          # Remove Payload folder if exists
          rm -rf Payload || true
          # Remove DerivedData
          rm -rf ios/build/DerivedData || true
          # Remove xcarchive
          rm -rf ios/build/*.xcarchive || true
          # Remove build folder contents except IPA
          find ios/build -type f ! -name "*.ipa" -delete 2>/dev/null || true
          find ios/build -type d -empty -delete 2>/dev/null || true
          # Remove any temporary build files (including work files)
          rm -f ios/build/*.log || true
          rm -f ios/build/*.tmp || true
          rm -f ios/build/*.work || true
          # Remove any mktemp files that might have been created
          find /tmp -name "tmp.*" -user $(whoami) -mmin -10 -delete 2>/dev/null || true
          # Clean up any temporary files in current directory
          find . -maxdepth 2 -name "*.tmp" -delete 2>/dev/null || true
          find . -maxdepth 2 -name "*.work" -delete 2>/dev/null || true
          echo "✅ Cleanup completed - only IPA file remains"

      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: IPA file not found!"
            echo "📂 Current directory contents:"
            ls -la
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small ($FILE_SIZE bytes). Expected at least 1MB."
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact (IPA only)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
