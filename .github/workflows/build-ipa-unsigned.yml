name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            echo ""
            echo "💡 To fix this:"
            echo "   1. Go to your GitHub repository"
            echo "   2. Navigate to: Settings > Secrets and variables > Actions"
            echo "   3. Click 'New repository secret'"
            echo "   4. Name: EXPO_TOKEN"
            echo "   5. Value: Your Expo access token"
            echo ""
            echo "📖 Get your token from: https://expo.dev/accounts/[your-account]/settings/access-tokens"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          pod repo update || true
          pod install --repo-update || pod install
          echo "✅ CocoaPods dependencies installed"

      - name: 🏗️ Build IPA (unsigned)
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building iOS app (unsigned)..."
          cd ios
          
          # Find workspace dynamically - search for .xcworkspace
          echo "🔍 Searching for workspace file..."
          WORKSPACE=$(find . -name "*.xcworkspace" -type d | head -1)
          
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            echo "📂 Current directory contents:"
            ls -la
            echo ""
            echo "📂 Searching for workspace/project files:"
            find . -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null | head -10
            exit 1
          fi
          
          # Get absolute path
          WORKSPACE=$(cd "$(dirname "$WORKSPACE")" && pwd)/$(basename "$WORKSPACE")
          echo "✅ Found workspace: $WORKSPACE"
          
          # Get scheme name from workspace
          echo "🔍 Detecting scheme..."
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            # Try to get from project name or use default
            PROJECT_NAME=$(basename "$WORKSPACE" .xcworkspace)
            if [ -n "$PROJECT_NAME" ] && [ "$PROJECT_NAME" != "." ]; then
              SCHEME="$PROJECT_NAME"
            else
              SCHEME="zyea-mobile"
            fi
            echo "⚠️ Could not detect scheme, using: $SCHEME"
          else
            echo "✅ Detected scheme: $SCHEME"
          fi
          
          # Clean build
          echo "🧹 Cleaning build..."
          rm -rf build/DerivedData || true
          xcodebuild clean -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release || true
          
          # Build
          echo "🏗️ Building app (unsigned)..."
          echo "📋 Build command:"
          echo "  Workspace: $WORKSPACE"
          echo "  Scheme: $SCHEME"
          echo "  Configuration: Release"
          echo "  SDK: iphoneos"
          echo "  Destination: generic/platform=iOS"
          echo "  Code Signing: DISABLED"
          
          BUILD_OUTPUT=$(mktemp)
          trap "rm -f '$BUILD_OUTPUT' 2>/dev/null || true" EXIT
          
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            -allowProvisioningUpdates 2>&1 | tee "$BUILD_OUTPUT"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed with exit code: $BUILD_EXIT_CODE"
            echo ""
            echo "📋 Error details:"
            grep -i "error:" "$BUILD_OUTPUT" | tail -30 || echo "No error messages found"
            echo ""
            echo "📋 Last 100 lines:"
            tail -100 "$BUILD_OUTPUT"
            rm -f "$BUILD_OUTPUT"
            trap - EXIT
            exit 1
          fi
          
          rm -f "$BUILD_OUTPUT"
          trap - EXIT
          echo "✅ Build completed successfully"
          cd ..
          
          # Find .app file
          echo "🔍 Finding .app file..."
          APP_PATH=""
          
          # Search in DerivedData first (most common location)
          if [ -d "ios/build/DerivedData/Build/Products" ]; then
            APP_PATH=$(find ios/build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via DerivedData: $APP_PATH"
            fi
          fi
          
          # Search in entire ios/build
          if [ -z "$APP_PATH" ] && [ -d "ios/build" ]; then
            APP_PATH=$(find ios/build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via ios/build: $APP_PATH"
            fi
          fi
          
          # Search in entire ios directory
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios -name "*.app" -type d 2>/dev/null | grep -v node_modules | grep -v ".expo" | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "✅ Found via ios directory: $APP_PATH"
            fi
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file"
            echo "📂 Debugging - searching for .app files:"
            find ios -type d -name "*.app" 2>/dev/null | head -10 || echo "No .app files found"
            echo ""
            echo "📂 Build structure:"
            ls -la ios/build/ 2>/dev/null || echo "ios/build does not exist"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          ls -lh "$APP_PATH" | head -5
          
          # Create IPA
          echo "📦 Creating IPA from $APP_PATH..."
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -r build.ipa Payload
          rm -rf Payload
          
          if [ ! -f "build.ipa" ]; then
            echo "❌ Failed to create IPA"
            exit 1
          fi
          
          echo "✅ IPA created successfully!"
          ls -lh build.ipa

      - name: 🧹 Cleanup build artifacts
        working-directory: ./mobile-expo
        run: |
          echo "🧹 Cleaning up build artifacts..."
          rm -rf Payload || true
          rm -rf ios/build/DerivedData || true
          rm -rf ios/build/*.xcarchive || true
          find ios/build -type f ! -name "*.ipa" -delete 2>/dev/null || true
          find ios/build -type d -empty -delete 2>/dev/null || true
          echo "✅ Cleanup completed - only IPA file remains"

      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: IPA file not found!"
            ls -la
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small ($FILE_SIZE bytes). Expected at least 1MB."
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact (IPA only)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
