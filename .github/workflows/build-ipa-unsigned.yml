name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Archive iOS app (unsigned)
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Archiving iOS app with xcodebuild..."
          
          # Find workspace and scheme
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
          fi
          
          echo "✅ Workspace: $WORKSPACE"
          echo "✅ Scheme: $SCHEME"
          echo ""
          
          # Clean previous builds
          echo "🧹 Cleaning previous builds..."
          rm -rf build/DerivedData build/app.xcarchive || true
          
          # Archive with xcodebuild (this creates .app in archive)
          echo "🚀 Archiving app (unsigned)..."
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/app.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            SKIP_INSTALL=NO
          
          ARCHIVE_EXIT_CODE=$?
          if [ $ARCHIVE_EXIT_CODE -ne 0 ]; then
            echo "❌ Archive failed with exit code: $ARCHIVE_EXIT_CODE"
            exit 1
          fi
          
          echo ""
          echo "✅ Archive completed successfully!"
          
          # Verify archive was created
          if [ ! -d "build/app.xcarchive" ]; then
            echo "❌ Archive directory not found!"
            exit 1
          fi
          
          echo "✅ Archive found at: build/app.xcarchive"

      - name: 📦 Extract .app from archive and create IPA
        working-directory: ./mobile-expo
        run: |
          echo "🔍 Searching for .app file in archive..."
          echo "Current directory: $(pwd)"
          echo ""
          
          # First, show archive structure
          echo "📂 Archive structure:"
          if [ -d "ios/build/app.xcarchive" ]; then
            ls -la ios/build/app.xcarchive/ 2>/dev/null || echo "Cannot list archive"
            echo ""
            echo "📂 Products directory:"
            ls -la ios/build/app.xcarchive/Products/ 2>/dev/null || echo "Products does not exist"
            echo ""
            echo "📂 Applications directory:"
            ls -la ios/build/app.xcarchive/Products/Applications/ 2>/dev/null || echo "Applications does not exist"
            echo ""
            echo "📂 All files in Products:"
            find ios/build/app.xcarchive/Products -type f 2>/dev/null | head -10 || true
            echo ""
            echo "📂 All directories in Products:"
            find ios/build/app.xcarchive/Products -type d 2>/dev/null | head -20 || true
            echo ""
          else
            echo "❌ Archive directory does not exist!"
            exit 1
          fi
          
          APP_PATH=""
          
          # Method 1: Archive Products/Applications/ (standard location)
          if [ -d "ios/build/app.xcarchive/Products/Applications" ]; then
            APP_PATH=$(find ios/build/app.xcarchive/Products/Applications -name "*.app" -type d -maxdepth 1 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 1 (Applications): $APP_PATH"
            fi
          fi
          
          # Method 2: Archive Products/ (direct)
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products" ]; then
            APP_PATH=$(find ios/build/app.xcarchive/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 2 (Products): $APP_PATH"
            fi
          fi
          
          # Method 3: Search entire archive
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive" ]; then
            APP_PATH=$(find ios/build/app.xcarchive -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 3 (entire archive): $APP_PATH"
            fi
          fi
          
          # Method 4: Check if .app is directly in Products (React Native sometimes does this)
          if [ -z "$APP_PATH" ] && [ -d "ios/build/app.xcarchive/Products" ]; then
            # List all items in Products to see structure
            for item in ios/build/app.xcarchive/Products/*; do
              if [ -d "$item" ] && [[ "$item" == *.app ]]; then
                APP_PATH="$item"
                echo "✅ Found .app via Method 4 (direct in Products): $APP_PATH"
                break
              fi
            done
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Could not find .app file in archive!"
            echo ""
            echo "📂 Final search - all .app files in entire project:"
            find . -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app files found anywhere"
            echo ""
            echo "💡 Archive may not contain .app file. Trying to find in DerivedData..."
            
            # Last resort: Check DerivedData from build
            if [ -d "ios/build/DerivedData" ]; then
              DERIVED_APP=$(find ios/build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
              if [ -n "$DERIVED_APP" ] && [ -d "$DERIVED_APP" ]; then
                APP_PATH="$DERIVED_APP"
                echo "✅ Found .app in DerivedData: $APP_PATH"
              fi
            fi
            
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              exit 1
            fi
          fi
          
          echo ""
          echo "✅ Found .app at: $APP_PATH"
          echo "📦 App details:"
          ls -lh "$APP_PATH" | head -5
          echo ""
          
          # Create IPA
          echo "📦 Creating IPA file..."
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_NAME" Payload/
          zip -r ../../../build.ipa Payload
          rm -rf Payload
          cd ../../../
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created successfully!"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi

      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
