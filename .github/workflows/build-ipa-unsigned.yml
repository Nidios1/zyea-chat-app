name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🔨 Running prebuild..."
          npx expo prebuild --platform ios --clean

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Build IPA with EAS Build Cloud (unsigned)
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "🏗️ Building IPA with EAS Build Cloud (unsigned profile)..."
          echo "📋 Using EAS Build Cloud with profile 'unsigned' (withoutCredentials: true)"
          echo "📋 This will build on Expo's cloud servers..."
          echo ""
          
          # Build with EAS Build Cloud - this handles React Native/Expo properly
          # No --local flag = builds on Expo cloud
          # --non-interactive to avoid prompts
          # --wait to wait for build completion
          # --json to get build info
          # --skip-credentials-check to skip credentials for unsigned build
          echo "🚀 Starting EAS Build..."
          BUILD_OUTPUT=$(eas build --platform ios \
            --profile unsigned \
            --non-interactive \
            --wait \
            --skip-credentials-check \
            --json 2>&1)
          
          BUILD_EXIT_CODE=$?
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ EAS Build failed with exit code: $BUILD_EXIT_CODE"
            echo "📋 Build output:"
            echo "$BUILD_OUTPUT"
            exit 1
          fi
          
          echo ""
          echo "✅ EAS Build completed successfully!"
          
          # Extract download URL from JSON output
          DOWNLOAD_URL=$(echo "$BUILD_OUTPUT" | grep -o '"artifacts":{"buildUrl":"[^"]*"' | grep -o 'https://[^"]*' | head -1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            # Try alternative JSON parsing
            DOWNLOAD_URL=$(echo "$BUILD_OUTPUT" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('artifacts', {}).get('buildUrl', ''))" 2>/dev/null || echo "")
          fi
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "⚠️ Could not extract download URL from build output"
            echo "📋 Build output:"
            echo "$BUILD_OUTPUT" | head -50
            echo ""
            echo "💡 You can download the IPA from Expo dashboard"
            exit 1
          fi
          
          echo "📥 Downloading IPA from: $DOWNLOAD_URL"
          curl -L -o build.ipa "$DOWNLOAD_URL"
          
          # Verify IPA was downloaded
          if [ -f "build.ipa" ]; then
            echo "✅ IPA file downloaded at: build.ipa"
            ls -lh build.ipa
          else
            echo "❌ IPA file download failed!"
            exit 1
          fi


      - name: ✅ Verify IPA file
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
