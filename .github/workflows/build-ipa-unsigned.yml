name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ipa-unsigned.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ Error: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "✅ EXPO_TOKEN is set"
          fi

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: 🔨 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ☕️ Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: ⚙️ Install dependencies
        working-directory: ./mobile-expo
        run: |
          npm install --legacy-peer-deps || npm install

      - name: 🔨 Prebuild iOS project (if needed)
        working-directory: ./mobile-expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -d "ios" ] && [ -f "ios/*.xcworkspace" ] || [ -f "ios/*.xcodeproj" ]; then
            echo "✅ ios/ folder already exists with native project"
            echo "📂 Checking ios/ folder structure..."
            ls -la ios/ | head -10
            echo ""
            echo "⏭️ Skipping prebuild - using existing ios/ folder"
          else
            echo "🔨 ios/ folder not found or incomplete, running prebuild..."
            npx expo prebuild --platform ios --clean
          fi

      - name: 📦 Install CocoaPods dependencies
        working-directory: ./mobile-expo/ios
        run: |
          pod install --repo-update || pod install

      - name: 🏗️ Build and create IPA
        working-directory: ./mobile-expo/ios
        run: |
          echo "🏗️ Building iOS app and creating IPA..."
          
          # Find workspace and scheme
          WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found!"
            exit 1
          fi
          
          echo "✅ Workspace: $WORKSPACE"
          echo ""
          
          # List all schemes and targets
          echo "📋 Available schemes:"
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 30 "Schemes:" || echo "Could not list schemes"
          echo ""
          echo "📋 Available targets:"
          xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 30 "Targets:" || echo "Could not list targets"
          echo ""
          
          # Get app scheme - exclude all EX* schemes, EASClient, Pods
          # First, get all schemes and filter out unwanted ones
          ALL_SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 30 "Schemes:" | grep -v "Schemes:" | xargs)
          echo "📋 All schemes found: $ALL_SCHEMES"
          echo ""
          
          # Filter out EX*, EASClient, Pods schemes
          SCHEME=$(echo "$ALL_SCHEMES" | tr ' ' '\n' | grep -v "^EX" | grep -v "EASClient" | grep -v "Pods" | head -1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            # Try to find scheme matching app name (zyea-mobile)
            SCHEME=$(echo "$ALL_SCHEMES" | tr ' ' '\n' | grep -i "zyea\|mobile" | head -1 | xargs)
          fi
          
          if [ -z "$SCHEME" ]; then
            # Try to find target name and use it as scheme
            ALL_TARGETS=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 30 "Targets:" | grep -v "Targets:" | xargs)
            TARGET=$(echo "$ALL_TARGETS" | tr ' ' '\n' | grep -v "^EX" | grep -v "Pods" | grep -v "EASClient" | head -1 | xargs)
            if [ -n "$TARGET" ]; then
              SCHEME="$TARGET"
              echo "⚠️ Using target as scheme: $SCHEME"
            fi
          fi
          
          if [ -z "$SCHEME" ]; then
            SCHEME="zyea-mobile"
            echo "⚠️ Using default scheme: $SCHEME"
          fi
          
          echo "✅ Using scheme: $SCHEME"
          echo ""
          
          # Clean
          echo "🧹 Cleaning..."
          rm -rf build || true
          
          # Build
          echo "🚀 Building app..."
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" 2>&1 | tee /tmp/build.log
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          # Check if build succeeded
          BUILD_SUCCEEDED=$(grep -i "BUILD SUCCEEDED" /tmp/build.log || echo "")
          
          if [ $BUILD_EXIT_CODE -ne 0 ] || [ -z "$BUILD_SUCCEEDED" ]; then
            echo "❌ Build failed or did not complete successfully!"
            echo "Build exit code: $BUILD_EXIT_CODE"
            echo "BUILD SUCCEEDED found: $([ -n "$BUILD_SUCCEEDED" ] && echo "Yes" || echo "No")"
            echo ""
            echo "📋 Searching for compilation errors..."
            grep -i "error:" /tmp/build.log | grep -v "note:" | tail -50 || echo "No errors found"
            echo ""
            echo "📋 Searching for failed targets..."
            grep -i "failed\|failure" /tmp/build.log | tail -20 || echo "No failures found"
            echo ""
            echo "📋 Checking for BUILD messages..."
            grep -i "BUILD" /tmp/build.log | tail -10
            echo ""
            echo "📋 Last 150 lines of build log:"
            tail -150 /tmp/build.log
            echo ""
            echo "💡 Common issues:"
            echo "   - Wrong scheme selected (should not be EX*, EASClient, Pods)"
            echo "   - Missing dependencies or codegen issues"
            echo "   - Code signing problems"
            exit 1
          fi
          
          echo ""
          echo "✅ Build completed successfully!"
          
          # Wait a bit for files to be written
          sleep 2
          
          # Find .app - check multiple locations
          echo "🔍 Searching for .app file..."
          APP_PATH=""
          
          # Method 1: Release-iphoneos
          if [ -d "build/DerivedData/Build/Products/Release-iphoneos" ]; then
            APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 1 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 1 (Release-iphoneos): $APP_PATH"
            fi
          fi
          
          # Method 2: Entire Products directory
          if [ -z "$APP_PATH" ] && [ -d "build/DerivedData/Build/Products" ]; then
            APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 2 (Products): $APP_PATH"
            fi
          fi
          
          # Method 3: Entire DerivedData
          if [ -z "$APP_PATH" ] && [ -d "build/DerivedData" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 3 (DerivedData): $APP_PATH"
            fi
          fi
          
          # Method 4: Entire build directory
          if [ -z "$APP_PATH" ] && [ -d "build" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "✅ Found .app via Method 4 (build): $APP_PATH"
            fi
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ .app file not found after build!"
            echo ""
            echo "📂 Debugging: Checking build structure..."
            echo "📂 DerivedData exists: $([ -d "build/DerivedData" ] && echo "Yes" || echo "No")"
            echo "📂 Products exists: $([ -d "build/DerivedData/Build/Products" ] && echo "Yes" || echo "No")"
            echo "📂 Release-iphoneos exists: $([ -d "build/DerivedData/Build/Products/Release-iphoneos" ] && echo "Yes" || echo "No")"
            echo ""
            if [ -d "build/DerivedData/Build/Products" ]; then
              echo "📂 Contents of Products:"
              ls -la build/DerivedData/Build/Products/ 2>/dev/null | head -20 || echo "Cannot list"
            fi
            echo ""
            echo "📂 All .app files in build:"
            find build -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi
          
          echo "✅ Found .app at: $APP_PATH"
          
          # Create IPA
          echo "📦 Creating IPA..."
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          APP_NAME=$(basename "$APP_PATH")
          cp -r "$APP_NAME" Payload/
          zip -r ../../../build.ipa Payload
          rm -rf Payload
          cd ../../../
          
          if [ -f "build.ipa" ]; then
            echo "✅ IPA created: build.ipa"
            ls -lh build.ipa
          else
            echo "❌ Failed to create IPA"
            exit 1
          fi


      - name: ✅ Verify and move IPA
        working-directory: ./mobile-expo
        run: |
          if [ ! -f "ios/build.ipa" ]; then
            echo "❌ Error: build.ipa not found!"
            exit 1
          fi
          
          # Move IPA to mobile-expo root
          mv ios/build.ipa build.ipa
          
          FILE_SIZE=$(stat -f%z build.ipa 2>/dev/null || stat -c%s build.ipa 2>/dev/null || echo "0")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE/1024/1024}")
          echo "📦 IPA file size: $FILE_SIZE bytes ($FILE_SIZE_MB MB)"
          
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ Error: IPA file is too small!"
            exit 1
          fi
          
          echo "✅ IPA file verified successfully!"

      - name: 📤 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: mobile-expo/build.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Unsigned IPA** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the IPA from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is unsigned. You can sign it manually with eSign before installing." >> $GITHUB_STEP_SUMMARY
